<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-label="Minimalistische Illustration eines orangefarbenen Pixel-Maskottchens, das mit einer Schaufel im Sandkasten spielt">
  <rect width="1280" height="960" fill="#FAF8F3"/>
  
  <!-- Quiet ground and contact shadow -->
  <ellipse cx="640" cy="776" rx="454" ry="44" fill="#ECE6DA"/>

  <!-- Sand box back and warm sand basin -->
  <path d="M216 566 Q216 544 239 544 H1041 Q1064 544 1064 566 V706 H216 Z" fill="#C98C67"/>
  <path d="M236 578 Q236 564 252 564 H1028 Q1044 564 1044 578 V722 H236 Z" fill="#E4AE7F"/>
  <path d="M252 605 Q252 589 268 589 H1013 Q1028 589 1028 605 V710 H252 Z" fill="#F4D49B"/>
  <path d="M253 649 Q351 631 441 650 T631 653 T837 647 T1027 650 V711 H253 Z" fill="#F6DCAB"/>

  <!-- The mascot's soft shadow -->
  <ellipse cx="651" cy="628" rx="166" ry="25" fill="#E9BC88" opacity=".55"/>

  <!-- A little sand sculpture on the left -->
  <ellipse cx="399" cy="675" rx="100" ry="21" fill="#E4BD7F" opacity=".55"/>
  <path d="M343 658 V631 H362 V613 H390 V631 H410 V612 H440 V631 H460 V659 Q460 669 449 669 H354 Q343 669 343 658 Z" fill="#E7B971"/>
  <path d="M370 613 V597 H385 V613 M418 612 V595 H433 V612" fill="none" stroke="#E7B971" stroke-width="17" stroke-linecap="butt"/>
  <path d="M389 669 V648 Q389 632 402 632 Q415 632 415 648 V669" fill="#DCA866"/>
  <path d="M356 639 H370 M432 641 H446" stroke="#D59A59" stroke-width="5" stroke-linecap="round"/>

  <!-- Small bucket -->
  <path d="M281 660 L296 705 Q300 714 313 714 H346 Q358 714 362 704 L376 660 Z" fill="#8EA59C"/>
  <path d="M282 661 Q330 674 376 661" fill="none" stroke="#668478" stroke-width="10" stroke-linecap="round"/>
  <path d="M294 660 C294 610 366 610 366 660" fill="none" stroke="#668478" stroke-width="8" stroke-linecap="round"/>

  <!-- Tiny sand ripples -->
  <path d="M470 687 Q494 682 511 687 M802 680 Q833 676 853 683 M930 699 Q952 693 976 699" fill="none" stroke="#E7BC7F" stroke-width="6" stroke-linecap="round"/>
  <circle cx="495" cy="615" r="5" fill="#E6B975"/>
  <circle cx="950" cy="627" r="5" fill="#E6B975"/>
  <circle cx="975" cy="612" r="3.5" fill="#E6B975"/>
  
  <!-- Claude Code-inspired blocky crab silhouette -->
  <path d="M538 274 H763 Q779 274 779 291 V337 H819 Q833 337 833 351 V412 Q833 425 819 425 H779 V601 Q779 619 761 619 H735 Q719 619 719 601 V570 H697 V601 Q697 619 679 619 H651 Q634 619 634 601 V570 H610 V601 Q610 619 594 619 H563 Q546 619 546 601 V425 H503 Q488 425 488 411 V352 Q488 337 503 337 H521 V291 Q521 274 538 274 Z" fill="#D97856"/>
  
  <!-- Subtle light on top of pixel body -->
  <path d="M548 290 H753" fill="none" stroke="#E58C6A" stroke-width="7" stroke-linecap="round" opacity=".4"/>

  <!-- Happy, softly squinting eyes and a small wide smile -->
  <path d="M581 396 Q607 367 633 396" fill="none" stroke="#392F2A" stroke-width="15" stroke-linecap="round"/>
  <path d="M670 396 Q696 367 722 396" fill="none" stroke="#392F2A" stroke-width="15" stroke-linecap="round"/>
  <path d="M617 449 Q652 483 687 449" fill="none" stroke="#392F2A" stroke-width="12" stroke-linecap="round"/>

  <!-- Shovel held in the right claw, diagonal into the sand -->
  <g transform="rotate(-18 862 528)">
    <rect x="854" y="440" width="14" height="189" rx="7" fill="#987458"/>
    <rect x="852" y="444" width="18" height="21" rx="7" fill="#B0896A"/>
    <path d="M862 428 C841 428 841 458 862 458 C883 458 883 428 862 428 Z" fill="none" stroke="#728B85" stroke-width="9"/>
    <path d="M839 619 Q839 610 849 610 H875 Q885 610 885 619 V643 Q885 660 862 675 Q839 660 839 643 Z" fill="#7E9691"/>
    <path d="M848 622 V646 Q848 656 862 666" fill="none" stroke="#A0B2A9" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  </g>
  
  <!-- Small sand pile at the shovel -->
  <path d="M867 690 Q899 644 924 678 Q950 665 972 692 Z" fill="#E9BD79"/>
  <path d="M902 675 Q920 658 933 683" fill="none" stroke="#DBA868" stroke-width="5" stroke-linecap="round"/>

  <!-- Front wooden railing: makes the mascot truly sit inside the sandbox -->
  <path d="M215 699 Q215 688 227 688 H1053 Q1065 688 1065 700 V758 Q1065 772 1051 772 H229 Q215 772 215 758 Z" fill="#CB906B"/>
  <path d="M231 691 H1049" stroke="#E2AE83" stroke-width="10" stroke-linecap="round"/>
  <path d="M229 758 H1050" stroke="#B87A59" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  <path d="M326 707 V752 M950 707 V752" stroke="#BA7F5D" stroke-width="5" stroke-linecap="round" opacity=".5"/>
  <circle cx="258" cy="728" r="5" fill="#AD7154" opacity=".65"/>
  <circle cx="1022" cy="728" r="5" fill="#AD7154" opacity=".65"/>
</svg>

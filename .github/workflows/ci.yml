name: CI
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap strace
          # Ubuntu 24.04 beschränkt unprivilegierte User Namespaces per AppArmor
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Unit-Tests
        run: make test race
      - name: Ausbruchstests mit Coverage
        run: make cover
      - name: Coverage-Zusammenfassung
        if: always() && hashFiles('cover/cover.out') != ''
        run: |
          echo "### Coverage ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool covdata percent -i=cover/unit,cover/escape >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover/cover.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('cover/cover.out') != ''
        with:
          name: coverage-${{ matrix.os }}
          path: cover/cover.out
      - name: Cross-Build
        if: matrix.os == 'ubuntu-24.04'
        run: make cross
